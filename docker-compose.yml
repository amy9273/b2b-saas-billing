services:
  postgres:
    image: postgres:16-alpine
    container_name: b2b_billing_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: billing_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - b2b_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d billing_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  b2b_postgres_data:
